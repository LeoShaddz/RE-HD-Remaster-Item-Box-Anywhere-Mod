name: Build RE1HD_ItemBoxAnywhere ASI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -Filter RE1HD_ItemBoxAnywhere.cpp | Select-Object -First 1
          if (-not $src) { throw "RE1HD_ItemBoxAnywhere.cpp not found" }
          Set-Location $src.DirectoryName
          cl /nologo /LD /O2 /MT /EHsc /D_CRT_SECURE_NO_WARNINGS RE1HD_ItemBoxAnywhere.cpp /Fe:RE1HD_ItemBoxAnywhere.asi /link user32.lib kernel32.lib
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: RE1HD_ItemBoxAnywhere
          path: |
            **/RE1HD_ItemBoxAnywhere.asi
            **/RE1HD_ItemBoxAnywhere.ini
