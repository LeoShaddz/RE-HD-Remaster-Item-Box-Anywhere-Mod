[ItemBox]
; 1 = mod ligado, 0 = desligado
Enable = 1

; Tecla do teclado que abre o bau. Aceita: letra ou numero (I, B, 5), F1..F12, Tab, Insert, Home, End,
; PageUp, PageDown, Numpad0..Numpad9, NumpadPlus, NumpadMinus, Mouse3/Mouse4/Mouse5 ou um codigo (0x49).
; Escreva None para desligar a tecla.
Key = I

; Combinacao de botoes do controle (XInput) que abre o bau, separados por +.
; Botoes: Start, Back, A, B, X, Y, LB, RB, LT, RT, LS, RS, DPadUp, DPadDown, DPadLeft, DPadRight.
; Escreva None para desligar o controle.
; OBS: o jogo tambem reage a cada botao sozinho (Start abre o inventario, Back abre o mapa). Se o inventario ou o
; mapa abrirem antes do bau, aperte os dois botoes ao mesmo tempo ou escolha uma combinacao que o jogo nao usa
; (por exemplo LB+RB+Y).
PadCombo = Start+Back

; Quanto tempo (ms) o pedido espera o jogo aceitar. O bau so abre onde o jogo ja deixaria abrir o inventario.
RequestTimeoutMs = 800

; Tempo minimo (ms) entre dois pedidos.
CooldownMs = 600

; 1 = toca o som de abrir o bau, 0 = abre em silencio.
PlaySound = 1

; 1 = gera RE1HD_ItemBoxAnywhere.log ao lado do .asi (diagnostico), 0 = sem log.
Log = 1
